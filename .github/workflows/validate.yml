name: Validate Radar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository
        run: python scripts/validate_repo.py
      - name: Check generated indexes
        run: |
          python scripts/update_archive_index.py
          python scripts/update_readme_stats.py
          git diff --exit-code -- README.md pdf/README.md
